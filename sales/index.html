<style>
body{margin:0;background:#0f2416}
a{color:#1f4d2b}a:hover{color:#123620}
*{box-sizing:border-box}

button{font:inherit}
.ph{width:100%;height:100%;object-fit:cover}
.card{transition:transform .4s ease, box-shadow .4s ease}

.card .ph{transition:transform 1.2s ease}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}

@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(50%)}}
.marquee{animation:marquee 38s linear infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,176,75,.6)}70%{box-shadow:0 0 0 18px rgba(232,176,75,0)}100%{box-shadow:0 0 0 0 rgba(232,176,75,0)}}
.float-cta{animation:pulse 2.4s ease-out infinite}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.answer{animation:fadeUp .35s ease both}
@keyframes popIn{from{transform:scale(.92);opacity:.4}to{transform:scale(1);opacity:1}}
.total{animation:popIn .3s ease}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.rec{animation:blink 1.4s ease-in-out infinite}
.spot{background:radial-gradient(520px circle at var(--mx,50%) var(--my,45%), rgba(255,236,180,.08), transparent 60%)}
.mpar{transform:translate(calc(var(--px,0) * -18px), calc(var(--py,0) * -12px));transition:transform .25s ease-out}
@keyframes fall{0%{transform:translate(0,-60px) rotate(0)}100%{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.leafy{position:absolute;top:0;animation:fall var(--t) linear var(--d) infinite;pointer-events:none}
@keyframes sway{0%{transform:translateX(-26px) rotateZ(-25deg) rotateX(15deg) rotateY(0deg)}25%{transform:translateX(0) rotateZ(5deg) rotateX(-35deg) rotateY(40deg)}50%{transform:translateX(26px) rotateZ(30deg) rotateX(10deg) rotateY(70deg)}75%{transform:translateX(0) rotateZ(0deg) rotateX(45deg) rotateY(30deg)}100%{transform:translateX(-26px) rotateZ(-25deg) rotateX(15deg) rotateY(0deg)}}
.leaf-sway{animation:sway var(--s,3.4s) ease-in-out infinite;transform-style:preserve-3d;perspective:400px}
.leaf-img{display:block;height:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.28)) saturate(1.1)}
@keyframes ffly{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}
@keyframes glow{0%,100%{opacity:.1}50%{opacity:1}}
.ff{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff6a8;box-shadow:0 0 14px 5px rgba(255,236,120,.65);animation:ffly var(--t) ease-in-out var(--d) infinite alternate, glow 2.4s ease-in-out var(--d) infinite;pointer-events:none}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
.star{position:absolute;border-radius:50%;background:#fffdf3;animation:twinkle var(--t) ease-in-out var(--d) infinite;pointer-events:none}
@keyframes nightIn{from{opacity:0}to{opacity:1}}
.night-layer{animation:nightIn 1.4s ease both}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.eq span{display:block;width:3px;height:14px;background:currentColor;border-radius:2px;transform-origin:50% 100%}
.eq-on span{animation:eq .9s ease-in-out infinite}
.eq-on span:nth-child(2){animation-delay:-.3s}.eq-on span:nth-child(3){animation-delay:-.6s}
@keyframes idleSwing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes pushA{0%{transform:rotate(-5deg)}12%{transform:rotate(22deg)}30%{transform:rotate(-17deg)}48%{transform:rotate(12deg)}66%{transform:rotate(-8deg)}84%{transform:rotate(4deg)}100%{transform:rotate(-5deg)}}
@keyframes pushB{0%{transform:rotate(-5deg)}12%{transform:rotate(22deg)}30%{transform:rotate(-17deg)}48%{transform:rotate(12deg)}66%{transform:rotate(-8deg)}84%{transform:rotate(4deg)}100%{transform:rotate(-5deg)}}
.swinger{transform-origin:0 0;animation:idleSwing 2.6s ease-in-out infinite alternate}
.swinger.swing-a{animation:pushA 5s ease-in-out, idleSwing 2.6s ease-in-out 5s infinite alternate}
.swinger.swing-b{animation:pushB 5s ease-in-out, idleSwing 2.6s ease-in-out 5s infinite alternate}
@keyframes shadowIdle{from{transform:translateX(34px) scaleX(.9)}to{transform:translateX(-34px) scaleX(.9)}}
.swing-shadow{animation:shadowIdle 2.6s ease-in-out infinite alternate}
@property --n{syntax:'<integer>';initial-value:0;inherits:false}
.count{--n:var(--to);counter-reset:n var(--n)}
.count::after{content:counter(n)}
@supports (animation-timeline: scroll()){
  @keyframes heroImg{from{transform:scale(1.18) translateY(0)}to{transform:scale(1) translateY(22%)}}
  .hero-img{animation:heroImg linear both;animation-timeline:scroll();animation-range:0 100vh}
  @keyframes heroTxt{to{transform:translateY(-120px);opacity:0;filter:blur(6px)}}
  .hero-txt{animation:heroTxt linear both;animation-timeline:scroll();animation-range:0 70vh}
  @keyframes darken{from{opacity:.25}to{opacity:.85}}
  .hero-shade{animation:darken linear both;animation-timeline:scroll();animation-range:0 100vh}
  @keyframes rise{from{opacity:0;transform:translateY(80px)}to{opacity:1;transform:none}}
  .reveal{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 30%}
  @keyframes zoomIn{from{transform:scale(1.35)}to{transform:scale(1)}}
  .zoom{animation:zoomIn linear both;animation-timeline:view();animation-range:entry 0% cover 60%}
  @keyframes open{from{clip-path:inset(14% 12% 14% 12% round 40px)}to{clip-path:inset(0 0 0 0 round 0)}}
  .opening{animation:open linear both;animation-timeline:view();animation-range:entry 10% cover 45%}
  @keyframes drift{from{transform:translateY(-12%) scale(1.15)}to{transform:translateY(12%) scale(1.15)}}
  .drift{animation:drift linear both;animation-timeline:view();animation-range:cover 0% cover 100%}
  @keyframes slideR{from{opacity:0;transform:translateX(120px)}to{opacity:1;transform:none}}
  .slide{animation:slideR linear both;animation-timeline:view();animation-range:entry 0% cover 35%}
  @keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .progress{animation:bar linear both;animation-timeline:scroll()}
  @keyframes cnt{from{--n:0}to{--n:var(--to)}}
  .count{animation:cnt linear both;animation-timeline:view();animation-range:entry 20% cover 45%}
  .gal{view-timeline-name:--gal;view-timeline-axis:block}
  @keyframes track{from{transform:translateX(0)}to{transform:translateX(calc(100% - 100vw + 10vw))}}
  .gal-track{animation:track linear both;animation-timeline:--gal;animation-range:contain 0% contain 100%}
  @keyframes galTitle{from{opacity:0;transform:translateY(40px)}20%{opacity:1;transform:none}to{opacity:1}}
  .gal-title{animation:galTitle linear both;animation-timeline:--gal;animation-range:contain 0% contain 100%}
  .day{view-timeline-name:--day}
  @keyframes line{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .day-line{transform-origin:50% 0;animation:line linear both;animation-timeline:--day;animation-range:entry 40% exit 60%}
  @keyframes dot{from{background:#dfe7d6;transform:scale(.6)}to{background:var(--c,#e8b04b);transform:scale(1)}}
  .day-dot{animation:dot linear both;animation-timeline:view();animation-range:entry 40% cover 38%}
  @keyframes cine{from{transform:scale(.82);border-radius:60px;filter:saturate(.6) brightness(.8)}to{transform:scale(1);border-radius:32px;filter:none}}
  .cinema{animation:cine linear both;animation-timeline:view();animation-range:entry 0% cover 45%}
  @keyframes settle{from{transform:rotate(-16deg)}to{transform:rotate(0deg)}}
  .swing-stage{view-timeline-name:--swing}
  .settle{transform-origin:0 0;animation:settle linear both;animation-timeline:--swing;animation-range:entry 0% cover 45%}
  @keyframes tilt{from{transform:perspective(900px) rotateX(18deg) translateY(60px);opacity:0}to{transform:none;opacity:1}}
  .tilt{animation:tilt linear both;animation-timeline:view();animation-range:entry 0% cover 35%}
}
.progress{position:fixed;top:0;right:0;left:0;height:4px;background:#e8b04b;transform-origin:100% 50%;z-index:30}



/* tractor scene */
.tscene{position:relative;z-index:5;margin:6px 0}
.ts-dot{position:absolute;left:50%;top:-29px;width:58px;height:58px;margin-left:-29px;border-radius:50%;background:#e38c3b;border:5px solid #fffdf3;color:#1c2b1f;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(20,58,34,.18);z-index:4}
.ts-stage{position:absolute;inset:0;overflow:hidden}
.ts-frame{position:relative;height:560px;border-radius:30px;overflow:hidden;background:#7a9a52;box-shadow:0 30px 70px rgba(20,58,34,.28);view-timeline-name:--trac;isolation:isolate}
.ts-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;filter:saturate(1.04) contrast(1.02)}
.ts-haze{position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(60% 50% at 88% 0%,rgba(255,226,160,.34),rgba(255,226,160,0) 70%),linear-gradient(180deg,rgba(255,240,210,0) 70%,rgba(120,90,50,.10))}
.ts-drive{position:absolute;bottom:22%;left:100%;height:56.7%;aspect-ratio:1191/886;z-index:2}
.ts-tractor{position:relative;height:100%;aspect-ratio:1191/886;animation:tidle .26s ease-in-out infinite alternate}
.ts-tractor > *{position:absolute}
.ts-body{inset:0;width:100%;height:100%;z-index:3;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.ts-spin{z-index:2;transform-origin:50% 50%}
.ts-spin img{width:100%;height:100%;display:block}
.ts-cast{left:-1.68%;top:67.72%;width:137.78%;height:36.12%;z-index:1;pointer-events:none}
.ts-fw{left:4.072%;top:69.244%;width:11.839%;height:15.914%;z-index:2;transform:scaleX(1.0567)}
.ts-fw img{width:100%;height:100%;display:block;animation:tspinf 17s linear infinite;animation-play-state:paused}
.ts-smoke,.ts-dusts{width:1px;height:1px;z-index:4}
.ts-puff{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,rgba(92,90,84,.7),rgba(92,90,84,.25) 45%,rgba(92,90,84,0) 72%);filter:blur(2px);opacity:0;animation:tpuff 3.2s cubic-bezier(.3,.6,.4,1) infinite;animation-delay:var(--d)}
.ts-dust{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,rgba(196,176,128,.35),rgba(196,176,128,0) 70%);opacity:0;animation:tdust 2.2s ease-out infinite;animation-delay:var(--d)}
.ts-card{position:absolute;top:26px;left:26px;z-index:5;max-width:400px;background:rgba(255,253,243,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:24px;padding:22px 24px 20px;box-shadow:0 18px 40px rgba(20,58,34,.18)}
.ts-time{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.ts-time span{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:40px;line-height:1;color:#e38c3b}
.ts-time small{font-weight:700;color:#3f7f4e;letter-spacing:.12em;font-size:14px}
.ts-card h3{margin:0 0 8px;font-size:25px;color:#143a22}
.ts-card p{margin:0 0 14px;color:#3c5240;line-height:1.6;font-size:16px}
.ts-chips{display:flex;flex-wrap:wrap;gap:8px}
.ts-chips span{background:#e9f3d8;color:#1f4d2b;font-weight:700;font-size:13px;padding:5px 11px;border-radius:999px}
@keyframes tidle{from{transform:translateY(0) rotate(0deg)}to{transform:translateY(-1.6px) rotate(-.28deg)}}
@keyframes tpuff{0%{opacity:0;transform:translate(0,0) scale(.5)}6%{opacity:.85}45%{opacity:.45}100%{opacity:0;transform:translate(var(--dx),-120px) scale(5)}}
@keyframes tdust{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:.8}100%{opacity:0;transform:translate(70px,-26px) scale(2.6)}}
@keyframes tdrive{from{left:100%;transform:translateX(0)}to{left:0;transform:translateX(-100%)}}
@keyframes tspin{from{rotate:0deg}to{rotate:-830deg}}
@keyframes tspinf{from{rotate:0deg}to{rotate:-2620deg}}
.ts-drive{left:100%;animation:tdrive 17s linear infinite;animation-play-state:paused}
.ts-spin{animation:tspin 17s linear infinite;animation-play-state:paused}
.ts-on .ts-drive,.ts-on .ts-spin,.ts-on .ts-fw img{animation-play-state:running}
@media (max-width: 760px){
  .tscene{margin:22px 0 6px}
  .ts-dot{left:auto;right:3px;margin-left:0;width:52px;height:52px;top:-26px}
  .ts-frame{height:auto;border-radius:24px;background:#fffdf3}
  .ts-stage{position:relative !important;height:260px}
  .ts-card{position:relative;top:auto;left:auto;max-width:none;border-radius:0;background:#fffdf3;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;padding:18px 18px 20px}
  .ts-hint{display:none}
  .ts-time span{font-size:32px}
  .ts-card h3{font-size:22px}
  .ts-drive,.ts-spin,.ts-fw img{animation-duration:12s}
  @keyframes tspin{from{rotate:0deg}to{rotate:-700deg}}
  @keyframes tspinf{from{rotate:0deg}to{rotate:-2200deg}}
}
/* line-art tractor riding the day line */
.dsun{display:none !important}
.dtrk{position:absolute;left:50%;top:30px;width:56px;height:42px;margin:-32px 0 0 -28px;z-index:1;pointer-events:none;transition:top .25s cubic-bezier(.2,.7,.3,1),transform .25s cubic-bezier(.2,.7,.3,1)}
.dtrk-in{width:100%;height:100%;transform:scaleX(1);transition:transform .5s cubic-bezier(.5,0,.3,1);filter:drop-shadow(0 4px 8px rgba(20,58,34,.16))}
.dtrk svg{width:100%;height:100%;overflow:visible;display:block}
.dtrk .rw,.dtrk .fw{transform-box:fill-box;transform-origin:center;transition:transform .25s cubic-bezier(.2,.7,.3,1)}
.dtrk .tb{animation:tbob .18s ease-in-out infinite alternate;animation-play-state:paused}
@keyframes tbob{from{transform:translateY(0)}to{transform:translateY(-.8px)}}
@media (max-width: 760px){ .dtrk{left:auto;right:29px;margin:-28px -24px 0 0;width:48px;height:36px} .droad{display:none} }
.droad{position:absolute;top:0;left:50%;width:96px;height:100%;margin-left:-48px;overflow:visible;pointer-events:none;z-index:1}
.droad-p{fill:none;stroke:rgba(150,104,48,.38);stroke-width:2.2;stroke-dasharray:1.5 7;stroke-linecap:round}
/* 15:00 card: camera move on scroll */
.dpan img{width:100%;height:100%;object-fit:cover;object-position:50% 58%;will-change:transform;transition:transform .35s cubic-bezier(.2,.7,.3,1)}
.spot{background:none !important}.mpar{transform:none !important}
@supports (animation-timeline: view()){ @keyframes tilt{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}} }
/* day timeline */
.snd-btn,.night-btn,.swing-extra{display:none !important}
.day{background:radial-gradient(70% 9% at 35% 71%,rgba(245,195,92,.32),rgba(245,195,92,0) 70%),linear-gradient(180deg,#f4f1e6 0%,#f4f1e6 40%,#eef2dc 54%,#e2ebc6 63%,#c8d8a4 70%,#7e9c63 77%,#3b6a45 84%,#1c4429 91%,#0f2416 100%)}
.day-stars{position:absolute;inset:0;pointer-events:none;z-index:0}
.dsteps{position:relative;display:flex;flex-direction:column;gap:56px}
.dline-bg,.dline{position:absolute;top:30px;bottom:30px;left:50%;width:4px;margin-left:-2px;border-radius:4px}
.dline-bg{background:rgba(31,77,43,.12)}
.dline{background:linear-gradient(180deg,#f5c35c 0%,#edb045 35%,#e99a3c 55%,#dc7a3c 75%,#cfe3cd 100%)}
.dsun{position:absolute;left:50%;top:30px;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#ffd36b;box-shadow:0 0 0 6px rgba(255,211,107,.25),0 0 30px 10px rgba(255,200,90,.45);z-index:3}
.dstep{position:relative;display:grid;grid-template-columns:1fr 96px 1fr;align-items:center}
.dstep .ddot{grid-column:2;grid-row:1;justify-self:center;width:58px;height:58px;border-radius:50%;background:var(--c);border:5px solid #fffdf3;display:flex;align-items:center;justify-content:center;color:#1c2b1f;box-shadow:0 8px 24px rgba(20,58,34,.18);z-index:2}
.dstep-r .dcard{grid-column:1;grid-row:1}.dstep-r .dtime{grid-column:3;grid-row:1;text-align:left}
.dstep-l .dcard{grid-column:3;grid-row:1}.dstep-l .dtime{grid-column:1;grid-row:1;text-align:right}
.dtime span{display:block;font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:64px;line-height:1;color:var(--c);letter-spacing:-.02em;text-shadow:0 2px 0 rgba(0,0,0,.04)}
.dtime small{display:block;margin-top:6px;font-size:15px;font-weight:700;letter-spacing:.2em;color:#3f7f4e;opacity:.8}
.dcard{background:#fffdf3;border-radius:26px;overflow:hidden;box-shadow:0 18px 40px rgba(20,58,34,.12);transition:transform .5s ease,box-shadow .5s ease}
.dcard:hover{transform:translateY(-6px);box-shadow:0 26px 50px rgba(20,58,34,.18)}
.dimg{height:190px;overflow:hidden}.dimg img{transition:transform 1.2s ease}.dcard:hover .dimg img{transform:scale(1.06)}
.dtxt{padding:20px 24px 24px}
.dt-sm{display:none;font-weight:800;color:#3f7f4e;font-size:15px;margin-bottom:4px}
.dtxt h3{margin:0 0 6px;font-size:25px;color:#143a22}
.dtxt p{margin:0;color:#3c5240;line-height:1.6}
.dstep-night .dcard{background:rgba(12,32,19,.78);border:1px solid rgba(207,227,205,.22);box-shadow:0 18px 50px rgba(0,0,0,.35),0 0 60px rgba(245,195,92,.12)}
.dstep-night .dtxt h3{color:#fffdf3}.dstep-night .dtxt p{color:#d3e4d2}.dstep-night .dt-sm{color:#f5c35c}
.dstep-night .dtime small{color:#cfe3cd}
.dstep-night .ddot{border-color:#173d26;color:#0f2416;box-shadow:0 0 0 6px rgba(207,227,205,.16),0 0 34px rgba(245,195,92,.35)}
@supports (animation-timeline: view()){
  @keyframes sunPath{0%{top:30px;background:#ffe08a}55%{background:#ffc35a}78%{background:#ff9a4a;box-shadow:0 0 0 6px rgba(255,140,70,.25),0 0 34px 12px rgba(255,130,60,.5)}100%{top:calc(100% - 30px);background:#f3f0d6;box-shadow:0 0 0 6px rgba(243,240,214,.2),0 0 34px 12px rgba(243,240,214,.5)}}
  .dsun{animation:sunPath linear both;animation-timeline:--day;animation-range:entry 40% exit 60%}
  .dcard.tilt{animation-range:entry 0% entry 90%}
}
@media (max-width: 760px){
  .dline-bg,.dline{left:auto !important;right:27px}
  .dsun{left:auto !important;right:18px;margin:-11px 0 0 0 !important}
  .dstep{grid-template-columns:58px 1fr !important;column-gap:14px;align-items:start}
  .dstep .ddot{grid-column:1 !important;width:52px;height:52px;margin-top:14px}
  .dstep .dcard{grid-column:2 !important}
  .dtime{display:none}
  .dt-sm{display:block}
  .dimg{height:150px}
  .dsteps{gap:30px}
}
/* pastoral calm layer */
.mist{position:absolute;left:-20%;right:-20%;top:36%;height:36%;pointer-events:none;mix-blend-mode:screen}
.mist i{position:absolute;inset:0;background:radial-gradient(42% 55% at 28% 58%,rgba(236,245,238,.30),transparent 70%),radial-gradient(34% 46% at 74% 44%,rgba(236,245,238,.24),transparent 70%);filter:blur(22px);animation:mist 80s ease-in-out infinite alternate}
.mist i+i{top:22%;opacity:.7;animation-duration:110s;animation-direction:alternate-reverse}
@keyframes mist{from{transform:translateX(-7%)}to{transform:translateX(7%)}}
.sunglow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 82% 8%,rgba(255,214,140,.30),rgba(255,214,140,0) 70%);mix-blend-mode:soft-light;animation:breathe 14s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.75}to{opacity:1}}
.hills{position:absolute;left:0;right:0;bottom:-1px;height:72px;pointer-events:none;z-index:3;line-height:0}
.hills svg{width:100%;height:100%;display:block}
.hills.top{top:-1px;bottom:auto;transform:scaleY(-1)}
.has-dapple{position:relative;overflow:hidden}
.has-dapple > :not(.dapple):not(.hills){position:relative;z-index:1}
.dapple{position:absolute;inset:0;pointer-events:none;z-index:0}
.dapple img{position:absolute;filter:brightness(0) blur(10px);opacity:.065;transform-origin:50% 0;animation:dapple 9s ease-in-out infinite alternate}
.dapple img:nth-child(2){animation-duration:11.5s;animation-delay:-4s}
.dapple img:nth-child(3){animation-duration:13s;animation-delay:-7s}
@keyframes dapple{from{transform:rotate(var(--r0,-4deg)) translateX(-10px)}to{transform:rotate(var(--r1,4deg)) translateX(10px)}}
@media (prefers-reduced-motion: reduce){
  .hero-img,.hero-txt,.hero-shade,.reveal,.zoom,.opening,.drift,.slide,.bob,.marquee,.count,.gal-track,.gal-title,.day-line,.day-dot,.tilt,.float-cta,.cinema,.rec,.swinger,.swing-shadow,.settle,.leafy,.leaf-sway,.ff,.star,.eq-on span,.mist i,.sunglow,.dapple img,.dsun,.ts-tractor,.ts-puff,.ts-dust{animation:none !important} .ts-drive,.ts-spin,.ts-fw img{animation-duration:40s !important}
}
